<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hussein Samy — Frontend engineer</title>
    <meta
      name="description"
      content="I ship production frontends that stay fast, accessible, and easy to change. Frontend engineer in Cairo, UTC+3, open to remote roles."
    />
    <script>
      // Set the theme before first paint so dark mode never flashes light.
      const stored = localStorage.getItem('theme')
      document.documentElement.dataset.theme =
        stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
